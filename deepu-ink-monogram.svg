  <path d="M54 9.5h35l-4.1 11.2H63.1l-1.8 5h15.9c7.4 0 10.4 5.1 8 11.8l-2.1 5.9C80.6 50.3 75.6 55 66.6 55H43.5l4.2-11.5h20.4c2.4 0 3.5-1.1 4.2-3l.9-2.6H57.7c-7.2 0-10.4-5.2-8-11.8l2.1-5.7c1.8-5.1 2.8-7.9 2.2-10.9Z" fill="#10141c" transform="translate(2.5 2.5)"/>
