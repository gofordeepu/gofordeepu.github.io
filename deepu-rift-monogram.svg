<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 64" role="img" aria-label="Deepu Singh rift monogram">
  <style>
    @keyframes rift-shift {
      0%, 100% { opacity: .38; transform: translateX(-2px); }
      50% { opacity: 1; transform: translateX(2px); }
    }
    @keyframes ink-spark {
      0%, 70%, 100% { opacity: .25; transform: scale(.7) rotate(0deg); }
      82% { opacity: 1; transform: scale(1.2) rotate(18deg); }
    }
    .rift {
      animation: rift-shift 2.5s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .spark {
      animation: ink-spark 2.9s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .rift, .spark { animation: none; }
    }
  </style>
  <defs>
    <filter id="rift-glow" x="-45%" y="-55%" width="190%" height="210%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path class="rift" d="M2 18h15M0 25h13M5 50h17" fill="none" stroke="#19c7d8" stroke-width="2.4" stroke-linecap="square" filter="url(#rift-glow)"/>
  <path class="rift" d="M70 7h14M76 14h12M72 56h16" fill="none" stroke="#ff4f64" stroke-width="2.2" stroke-linecap="square" filter="url(#rift-glow)" style="animation-delay:.3s"/>

  <path d="M12.5 10.5h22c16 0 24 8.5 24 21.5s-8.5 22.5-24.5 22.5H12.5Zm12 11v22h9c7.8 0 12.2-4.1 12.2-11.3 0-6.8-4.4-10.7-12.2-10.7Z" fill="#ff4f64" opacity=".78" transform="translate(2.8 2.5)"/>
  <path d="M10 8h22c16 0 24 8.5 24 21.5S47.5 52 31.5 52H10Zm12 11v22h9c7.8 0 12.2-4.1 12.2-11.3C43.2 22.9 38.8 19 31 19Z" fill="#19c7d8" fill-rule="evenodd" stroke="#10141c" stroke-width="2.8" stroke-linejoin="bevel"/>
  <path d="M16 13v34M25 14h8.5" fill="none" stroke="#fffdf7" stroke-width="2" stroke-linecap="square" opacity=".9"/>

  <path d="M49.5 8.5H84l-4.4 12H58.2l-1.8 5.2h15.8c7.4 0 10.6 5.4 8.1 12.1l-2.4 6.4C75.6 50.5 70.6 54 63.1 54H34l4.5-12h23.2l1.9-5.1H48.1c-7.2 0-10.6-5.2-8.2-11.8l2.1-5.8c2.3-6.4 3.4-8.2 7.5-10.8Z" fill="#7667f2" opacity=".8" transform="translate(2.6 2.4)"/>
  <path d="M47 6h34.5l-4.4 12H55.7l-1.8 5.2h15.8c7.4 0 10.6 5.4 8.1 12.1l-2.4 6.4C73.1 48 68.1 51.5 60.6 51.5H31.5l4.5-12h23.2l1.9-5.1H45.6c-7.2 0-10.6-5.2-8.2-11.8l2.1-5.8C41.8 10.4 42.9 8.6 47 6Z" fill="#fffdf7" stroke="#10141c" stroke-width="2.8" stroke-linejoin="bevel"/>
  <path d="M51 12h20M42 45h18" fill="none" stroke="#ffd447" stroke-width="2.7" stroke-linecap="square"/>
  <path d="m43 29 29-8" fill="none" stroke="#ff4f64" stroke-width="2.2" stroke-linecap="square"/>

