<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 92 64" role="img" aria-label="Deepu Singh manga sigil">
  <style>
    @keyframes slash-charge {
      0%, 100% { opacity: .55; transform: translateX(-3px); }
      50% { opacity: 1; transform: translateX(3px); }
    }
    @keyframes spark-pop {
      0%, 72%, 100% { opacity: .35; transform: scale(.72) rotate(0deg); }
      82% { opacity: 1; transform: scale(1.18) rotate(16deg); }
    }
    .charge {
      animation: slash-charge 2.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .spark {
      animation: spark-pop 2.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @media (prefers-reduced-motion: reduce) {
      .charge, .spark { animation: none; }
    }
  </style>
  <defs>
    <filter id="sigil-glow" x="-40%" y="-50%" width="180%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M8 49 18 9h57" fill="none" stroke="#19c7d8" stroke-width="5" stroke-linecap="square" stroke-linejoin="bevel" filter="url(#sigil-glow)"/>
  <path d="m83 13-12 42H14" fill="none" stroke="#ff4f64" stroke-width="4" stroke-linecap="square" stroke-linejoin="bevel" filter="url(#sigil-glow)"/>
  <path d="m13 54 8-39h55" fill="none" stroke="#fffdf7" stroke-width="1.4" stroke-linecap="square" opacity=".9"/>

  <text x="45" y="45" fill="#ff4f64" stroke="#10141c" stroke-width="6" paint-order="stroke" font-family="Arial Black, Arial, sans-serif" font-size="36" font-style="italic" font-weight="900" text-anchor="middle">DS</text>
  <text x="42.5" y="42.5" fill="#fffdf7" stroke="#10141c" stroke-width="4" paint-order="stroke" font-family="Arial Black, Arial, sans-serif" font-size="36" font-style="italic" font-weight="900" text-anchor="middle">DS</text>

  <path class="charge" d="m8 38 73-18-2.2 7L7 43Z" fill="#ffd447" stroke="#10141c" stroke-width="1.2"/>
  <path d="m17 31 50-12" fill="none" stroke="#fffdf7" stroke-width="1.2" opacity=".85"/>

  <path class="spark" d="m82 5 2.2 5.2L90 12l-5.8 1.8L82 19l-2.2-5.2L74 12l5.8-1.8Z" fill="#7667f2" stroke="#10141c" stroke-width="1"/>
  <path class="spark" d="m5 8 1.4 3.2L10 12.5l-3.6 1.2L5 17l-1.4-3.3L0 12.5l3.6-1.3Z" fill="#ff4f64" style="animation-delay:.35s"/>
  <path d="M73 58h12M76 53h10" fill="none" stroke="#19c7d8" stroke-width="2" stroke-linecap="square"/>
</svg>
