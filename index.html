    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("deepu-theme-mode");
          const theme = ["light", "dark"].includes(savedTheme)
            ? savedTheme
            : "dark";
          const savedAccent = localStorage.getItem("deepu-accent");
          const validAccents = ["cyan", "coral", "yellow", "violet"];
          const savedDesign = localStorage.getItem("deepu-design-mode");

          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.accent = validAccents.includes(savedAccent)
            ? savedAccent
            : "cyan";
          document.documentElement.dataset.design = ["modern", "ninja"].includes(savedDesign)
            ? savedDesign
            : "modern";
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.dataset.accent = "cyan";
          document.documentElement.dataset.design = "modern";
        }
      })();
    </script>
