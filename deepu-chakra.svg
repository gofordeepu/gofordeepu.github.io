<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Deepu chakra">
  <style>
    @keyframes chakra-spin {
      to { transform: rotate(360deg); }
    }
    @keyframes chakra-pulse {
      0%, 100% { opacity: .42; }
      50% { opacity: 1; }
    }
    .chakra-ring {
      animation: chakra-spin 12s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .chakra-halo {
      animation: chakra-pulse 2.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .chakra-ring, .chakra-halo { animation: none; }
    }
  </style>
  <defs>
    <filter id="chakra-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="1.35" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="#10141c"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#fffdf7" stroke-width="1.2" opacity=".82"/>
  <g class="chakra-ring" fill="none" stroke-linecap="round" filter="url(#chakra-glow)">
    <circle cx="32" cy="32" r="23.5" stroke="#19c7d8" stroke-width="2.1" stroke-dasharray="2 4"/>
    <path d="M32 7v9" stroke="#ffd447" stroke-width="3"/>
    <path d="M32 7v9" stroke="#19c7d8" stroke-width="3" transform="rotate(30 32 32)"/>
    <path d="M32 7v9" stroke="#ff4f64" stroke-width="3" transform="rotate(60 32 32)"/>
    <path d="M32 7v9" stroke="#ffd447" stroke-width="3" transform="rotate(90 32 32)"/>
    <path d="M32 7v9" stroke="#19c7d8" stroke-width="3" transform="rotate(120 32 32)"/>
    <path d="M32 7v9" stroke="#ff4f64" stroke-width="3" transform="rotate(150 32 32)"/>
    <path d="M32 7v9" stroke="#ffd447" stroke-width="3" transform="rotate(180 32 32)"/>
    <path d="M32 7v9" stroke="#19c7d8" stroke-width="3" transform="rotate(210 32 32)"/>
    <path d="M32 7v9" stroke="#ff4f64" stroke-width="3" transform="rotate(240 32 32)"/>
    <path d="M32 7v9" stroke="#ffd447" stroke-width="3" transform="rotate(270 32 32)"/>
    <path d="M32 7v9" stroke="#19c7d8" stroke-width="3" transform="rotate(300 32 32)"/>
    <path d="M32 7v9" stroke="#ff4f64" stroke-width="3" transform="rotate(330 32 32)"/>
  </g>
  <circle cx="32" cy="32" r="13.5" fill="#fffdf7" stroke="#ff4f64" stroke-width="2"/>
  <circle class="chakra-halo" cx="32" cy="32" r="11.5" fill="none" stroke="#ffd447" stroke-width="2.4" filter="url(#chakra-glow)"/>
  <g class="chakra-core">
    <circle cx="32" cy="32" r="10" fill="#10141c" stroke="#19c7d8" stroke-width="1.35"/>
    <text x="32" y="35.7" fill="#fffdf7" font-family="Arial Black,Arial,sans-serif" font-size="10.5" font-weight="900" text-anchor="middle">DS</text>
  </g>
</svg>
